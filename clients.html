<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>Clients — OnBrand One</title>
<meta name="description" content="The comedians, creators, and podcasts OnBrand One edits clips for.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo_onb_2.png" alt="OnBrand One logo" class="logo-mark logo-mark--primary"></a>
    <a href="contact.html" class="btn">Get in touch</a>
  </nav>
</header>

<div class="page-head">
  <div class="wrap">
    <h1>Clients</h1>
    <p>The comedians, creators, and podcasts we cut clips for, every week.</p>
  </div>
</div>

<section class="people" id="creators">
  <div class="wrap">
    <div class="section-head">
      <h2>Creators</h2>
    </div>
    <div class="grid" id="creators-grid"></div>
  </div>
</section>

<section class="people" id="podcasts">
  <div class="wrap">
    <div class="section-head">
      <h2>Podcasts</h2>
    </div>
    <div class="podcast-grid" id="podcasts-grid"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="row">
      <h2>Got long-form footage sitting around? Let's clip it.</h2>
      <a href="contact.html" class="btn">Get in touch</a>
    </div>
    <div class="meta">
      <span>© 2026 OnBrand One</span>
      <a data-linkedin href="#" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</footer>

<script src="content.js"></script>
<script>
  renderCreatorGrid('creators-grid', CREATORS);
  renderPodcastGrid('podcasts-grid', PODCASTS);
</script>
</body>
</html>

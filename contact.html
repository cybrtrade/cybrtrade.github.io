<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Contact — OnBrand One</title>
<meta name="description" content="Get in touch with OnBrand One.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo_onb_2.png" alt="OnBrand One logo" class="logo-mark logo-mark--primary"></a>
    <a href="contact.html" class="btn">Get in touch</a>
  </nav>
</header>

<section class="contact-block">
  <div class="wrap">
    <h1>Let's get your footage clipped.</h1>
    <p class="lede">Send over a show, an episode, or just a question — we'll reply from a real inbox, not a form.</p>

    <div class="contact-methods">
      <div class="contact-method">
        <h3>Email</h3>
        <p data-email-text>arbiujka@gmail.com</p>
        <a class="btn" data-mailto href="#">Send an email</a>
      </div>
      <div class="contact-method">
        <h3>Phone</h3>
        <p data-phone-text>+355 69 964 2150</p>
        <div class="btn-row">
          <a class="btn" data-imessage href="#">iMessage</a>
          <a class="btn outline" data-whatsapp href="#" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="meta">
      <span>© 2026 OnBrand One</span>
    </div>
  </div>
</footer>

<script src="content.js"></script>
</body>
</html>
